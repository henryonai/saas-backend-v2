[project]
name = "saas-billing"
version = "0.1.0"
requires-python = ">=3.13"
# Add packages only this module needs. Shared ones come from saas-shared (the layer).
dependencies = [
    "saas-shared",
    "stripe>=16,<17",   # a new major version moves to a new Stripe API version: upgrade on purpose
]

[dependency-groups]
dev = ["saas-testkit"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "billing"

[tool.uv.sources]
saas-shared = { workspace = true }
saas-testkit = { workspace = true }
