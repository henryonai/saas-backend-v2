AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Multi-tenant SaaS backend (accounts, orders, notifications, billing)"

# One template, one section per module. Each module has its own functions and
# its own table. When a module moves to its own repository, move its section.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  PaymentProvider:
    Type: String
    AllowedValues: [dev, stripe]
    Default: dev
    Description: >-
      dev = the stand-in (checkout on the app's /dev-checkout page, webhooks from scripts/dev-pay.py);
      stripe = Stripe (run scripts/stripe-setup.py after the first deploy)
  PaymentWebhookSecretParam:
    Type: String
    Default: /saas/dev/payment-webhook-secret
    Description: >-
      Name of an SSM SecureString parameter holding the webhook secret: create it first (dev), or
      let scripts/stripe-setup.py write Stripe's signing secret (stripe)
  StripeSecretKeyParam:
    Type: String
    Default: /saas/dev/stripe-secret-key
    Description: Name of an SSM SecureString parameter holding the Stripe secret key (stripe only)
  StripeConfigParam:
    Type: String
    Default: /saas/dev/stripe-config
    Description: Name of the SSM parameter where scripts/stripe-setup.py saves prices and portal (stripe only)
  EmailSender:
    Type: String
    Default: ""
    Description: Sender address for app and Cognito emails. Empty = app emails are only logged.
  SesIdentity:
    Type: String
    Default: ""
    Description: >-
      Domain or address verified in SES that covers EmailSender. Set it to send Cognito emails
      (sign-up codes) through SES; empty = Cognito's built-in sender, limited to ~50 emails a day.
  AppUrl:
    Type: String
    Default: ""
    Description: >-
      The app's address, used in checkout and invitation links. Empty = the app this stack
      hosts (the WebUrl output); set it when you serve the app from your own domain.
  CorsOrigin:
    Type: String
    Default: ""
    Description: >-
      The origin allowed to call the API from a browser. Empty = the app this stack hosts;
      "*" lets any origin call it (dev, so a local dev server works too).
  AlertEmail:
    Type: String
    Default: ""
    Description: Email that receives alarms (failed events, dead-letter queues) and budget alerts. Empty = no subscription.
  AccountBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Monthly budget for the whole AWS account, in USD: AlertsTopic gets an alert at 80% of it
      and when the month's forecast passes it. 0 = no budget. Dev and prod share an account by
      default, so set it in one of them.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  AssistantCodeBucket:
    Type: String
    Default: ""
    Description: S3 bucket with the assistant's code zip (scripts/package-assistant.py prints it). Empty = no assistant.
  AssistantCodeKey:
    Type: String
    Default: ""
    Description: Key of that zip. It changes with the code, which is what makes CloudFormation update the agent.
  AssistantModelId:
    Type: String
    Default: deepseek/deepseek-v4.1-flash-1017
    Description: >-
      The assistant's model: an OpenRouter model (vendor/model, as here, or e.g.
      anthropic/claude-sonnet-5.5) or a Bedrock model or inference profile id
      (e.g. global.anthropic.claude-sonnet-5-5)
  OpenRouterApiKeyParam:
    Type: String
    Default: /saas/dev/openrouter-api-key
    Description: >-
      Name of an SSM SecureString parameter holding the OpenRouter API key (create it first;
      read only for OpenRouter models)
  AssistantSandboxNetwork:
    Type: String
    Default: SANDBOX
    AllowedValues: [SANDBOX, PUBLIC]
    Description: >-
      Network for the assistant's terminal. SANDBOX = no internet (AWS says S3 stays reachable,
      but the sandbox has no AWS role). PUBLIC = internet (pip install, curl), so the model's
      commands could also send data out.
  TenantDeletionDays:
    Type: Number
    Default: 7
    MinValue: 0
    Description: >-
      Days the owner of a deleted workspace can restore it before the purge job removes
      it and its data in every module, a fraction for a test stack (0.001 is about 90
      seconds). The purge job runs hourly, so it removes it at the first run after that.
  AssistantConversationDays:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Days the assistant keeps a conversation after its last message. 0 = until its user
      deletes it or leaves the workspace, as in ChatGPT.

# How a deploy moves an API function's traffic to the new code (DeploymentPreference).
# In prod, 10% for 5 minutes first, rolled back if an alarm fires; dev switches at once.
# A map, not !If: SAM resolves only Ref and FindInMap in DeploymentPreference.
Mappings:
  Rollout:
    dev: { Type: AllAtOnce }
    prod: { Type: Canary10Percent5Minutes }

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  UseSes: !And [!Not [!Equals [!Ref EmailSender, ""]], !Not [!Equals [!Ref SesIdentity, ""]]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasBudget: !Not [!Equals [!Ref AccountBudgetUsd, "0"]]
  HasAppUrl: !Not [!Equals [!Ref AppUrl, ""]]
  HasCorsOrigin: !Not [!Equals [!Ref CorsOrigin, ""]]
  HasAssistant: !And [!Not [!Equals [!Ref AssistantCodeBucket, ""]], !Not [!Equals [!Ref AssistantCodeKey, ""]]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Layers: [!Ref SharedLayer]
    Tracing: Active                       # X-Ray traces of every invocation, no SDK needed
    LoggingConfig:
      LogGroup: !Ref AppLogGroup          # one log group with a retention period
    Environment:
      Variables:
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_METRICS_NAMESPACE: !Sub saas-${Stage}

Resources:
  # =====================================================================
  # Shared: layer, events, login (Cognito), HTTP API, logs and alarms
  # =====================================================================
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/shared/layer/
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete             # don't keep every old version after each deploy
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64

  # Each stack has its own bus, so dev and prod never receive each other's events.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ${AWS::StackName}-events

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain                # deleting the stack must not delete every login
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub saas-${Stage}
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # A changed email stays unused until the user verifies it, so the email
      # claim in tokens is always an address the user proved they own.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 12 }
      MfaConfiguration: "OPTIONAL"        # users can turn on an authenticator app
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      EmailConfiguration: !If
        - UseSes
        - EmailSendingAccount: DEVELOPER
          From: !Ref EmailSender
          SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentity}
        - EmailSendingAccount: COGNITO_DEFAULT

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED # don't reveal which emails have an account
      EnableTokenRevocation: true
      # Short-lived tokens: role or membership changes reach other modules within 15 minutes.
      IdTokenValidity: 15
      AccessTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!If [HasCorsOrigin, !Ref CorsOrigin, !Sub "https://${WebDistribution.DomainName}"]]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        # x-tenant-id: the workspace (shared/auth.py); idempotency-key: makes a retried create safe (orders)
        AllowHeaders: [content-type, authorization, x-tenant-id, idempotency-key]
      DefaultRouteSettings:               # protects the functions (and your bill) from floods
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "route":"$context.routeKey","status":"$context.status","latencyMs":"$context.responseLatency",
          "user":"$context.authorizer.claims.sub","error":"$context.integrationErrorMessage"}
      Auth:
        DefaultAuthorizer: CognitoJwt   # every route requires login unless stated
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  # Publishes the events modules save in their tables (shared/outbox.py).
  # Its code is in the shared layer; the inline file only points to it.
  OutboxRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      InlineCode: "from shared.outbox import handler  # noqa: F401 (code is in the shared layer)"
      Handler: index.handler
      Timeout: 60                       # room to publish a batch while EventBridge is slow
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: outbox-relay
          EVENT_BUS_NAME: !Ref EventBus  # the only function that publishes
      Policies:
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OutboxDLQ.QueueName }
      Events:
        Accounts:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AccountsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 50
            FunctionResponseTypes: [ReportBatchItemFailures]
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: -1      # retry as often as it takes, but
            MaximumRecordAgeInSeconds: 3600   # only for an hour: then OutboxDLQ, so one bad record can't hold up its shard all day
            DestinationConfig: { OnFailure: { Type: SQS, Destination: !GetAtt OutboxDLQ.Arn } }
            FilterCriteria:
              Filters: [{ Pattern: '{"eventName": ["INSERT"], "dynamodb": {"Keys": {"pk": {"S": [{"prefix": "OUTBOX#"}]}}}}' }]
        Orders:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt OrdersTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 50
            FunctionResponseTypes: [ReportBatchItemFailures]
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: -1      # retry as often as it takes, but
            MaximumRecordAgeInSeconds: 3600   # only for an hour: then OutboxDLQ, so one bad record can't hold up its shard all day
            DestinationConfig: { OnFailure: { Type: SQS, Destination: !GetAtt OutboxDLQ.Arn } }
            FilterCriteria:
              Filters: [{ Pattern: '{"eventName": ["INSERT"], "dynamodb": {"Keys": {"pk": {"S": [{"prefix": "OUTBOX#"}]}}}}' }]
        Billing:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt BillingTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 50
            FunctionResponseTypes: [ReportBatchItemFailures]
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: -1      # retry as often as it takes, but
            MaximumRecordAgeInSeconds: 3600   # only for an hour: then OutboxDLQ, so one bad record can't hold up its shard all day
            DestinationConfig: { OnFailure: { Type: SQS, Destination: !GetAtt OutboxDLQ.Arn } }
            FilterCriteria:
              Filters: [{ Pattern: '{"eventName": ["INSERT"], "dynamodb": {"Keys": {"pk": {"S": [{"prefix": "OUTBOX#"}]}}}}' }]

  # Where the relay reports records it could not publish within an hour (which
  # records, not the events themselves). The events are still in the tables for
  # 7 days: republish them with scripts/replay-outbox.py.
  OutboxDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  OutboxDLQPolicy:                      # the relay sends with its role; this only refuses plain HTTP
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OutboxDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt OutboxDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }

  AlertsTopic:
    Type: AWS::SNS::Topic

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Who may publish alerts: this account's alarms, and AWS Budgets (AccountBudget).
  # A topic policy replaces the topic's default one, so the alarms need their own statement.
  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Alarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*" }
          - Sid: Budgets
            Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:budgets::${AWS::AccountId}:*" }

  # The whole account's spending, not only this stack's: Bedrock models included,
  # OpenRouter not (it bills you directly; give its key a credit limit there).
  AccountBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    DependsOn: AlertsTopicPolicy          # Budgets checks that it may publish to the topic
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-account
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref AccountBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !Ref AlertsTopic }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: SNS, Address: !Ref AlertsTopic }]

  OutboxDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Events could not be published (see OutboxDLQ, then run scripts/replay-outbox.py)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt OutboxDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # The relay retries a record it can't publish for up to an hour, and later
  # events on the same shard wait behind it. This fires within minutes, before
  # the record goes to OutboxDLQ.
  OutboxLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Events are waiting to be published (see outbox-relay in the app log group)
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref OutboxRelayFunction }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300000                   # 5 minutes, in milliseconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no events, no data
      AlarmActions: [!Ref AlertsTopic]

  # Every route's 5xx: an uncaught error or a timeout (logged as "Unhandled error",
  # shared/http.py), or 503 when one item keeps colliding. The payment webhook too.
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API answered 5xx (see the access log's error field, then "Unhandled error" in the app log group)
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no requests, no data
      AlarmActions: [!Ref AlertsTopic]

  # What rolls a prod deploy back: an API function failed (an uncaught error, which
  # shared/http.py logs as "Unhandled error" and re-raises, a timeout, or code that
  # can't load). ApiErrorsAlarm can't be used: it names the HTTP API, whose routes
  # wait for the new alias, which waits for this alarm. No email: ApiErrorsAlarm
  # already sends one for the same failures.
  ApiFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An API function failed (CodeDeploy rolls a canary back on this; see "Unhandled error" in the app log group)
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          ReturnData: true
        - { Id: accounts, ReturnData: false, MetricStat: { Stat: Sum, Period: 60, Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsApiFunction }] } } }
        - { Id: orders, ReturnData: false, MetricStat: { Stat: Sum, Period: 60, Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref OrdersApiFunction }] } } }
        - { Id: notifications, ReturnData: false, MetricStat: { Stat: Sum, Period: 60, Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref NotificationsApiFunction }] } } }
        - { Id: billing, ReturnData: false, MetricStat: { Stat: Sum, Period: 60, Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref BillingApiFunction }] } } }
        - { Id: webhook, ReturnData: false, MetricStat: { Stat: Sum, Period: 60, Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref BillingWebhookFunction }] } } }
        - !If
          - HasAssistant
          - { Id: assistant, ReturnData: false, MetricStat: { Stat: Sum, Period: 60, Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref AssistantApiFunction }] } } }
          - !Ref AWS::NoValue
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no errors, no data

  # Lambda refused to run this stack's request-path functions (the account's
  # concurrency, which dev and prod share, ran out). Only this stack's functions,
  # not the account-wide metric, so dev's load can't roll back a prod deploy.
  # Workers aren't listed: their queues hold the messages and retry them.
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda throttled an API, sign-in or outbox function (see Throttles per function in AWS/Lambda)
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          ReturnData: true
        - { Id: accounts, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsApiFunction }] } } }
        - { Id: pretoken, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsPreTokenFunction }] } } }
        - { Id: orders, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref OrdersApiFunction }] } } }
        - { Id: notifications, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref NotificationsApiFunction }] } } }
        - { Id: billing, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref BillingApiFunction }] } } }
        - { Id: webhook, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref BillingWebhookFunction }] } } }
        - { Id: relay, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref OutboxRelayFunction }] } } }
        - !If
          - HasAssistant
          - { Id: assistant, ReturnData: false, MetricStat: { Stat: Sum, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Throttles, Dimensions: [{ Name: FunctionName, Value: !Ref AssistantApiFunction }] } } }
          - !Ref AWS::NoValue
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no throttles, no data
      AlarmActions: [!Ref AlertsTopic]

  # A function's p99 duration passed 80% of its timeout for 15 minutes: it is about
  # to time out (a slow table, Stripe or Bedrock call, or too little memory).
  # Each line is p99 / the function's Timeout, so update both when a Timeout changes.
  ApiDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An API or sign-in function is close to its timeout (see Duration p99 per function in AWS/Lambda)
      Metrics:
        - Id: worst
          Expression: !If
            - HasAssistant
            - MAX([accounts / 10000, pretoken / 5000, orders / 10000, notifications / 10000, billing / 10000, webhook / 15000, assistant / 10000])
            - MAX([accounts / 10000, pretoken / 5000, orders / 10000, notifications / 10000, billing / 10000, webhook / 15000])
          ReturnData: true
        - { Id: accounts, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsApiFunction }] } } }
        - { Id: pretoken, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsPreTokenFunction }] } } }
        - { Id: orders, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref OrdersApiFunction }] } } }
        - { Id: notifications, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref NotificationsApiFunction }] } } }
        - { Id: billing, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref BillingApiFunction }] } } }
        - { Id: webhook, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref BillingWebhookFunction }] } } }
        - !If
          - HasAssistant
          - { Id: assistant, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref AssistantApiFunction }] } } }
          - !Ref AWS::NoValue
      EvaluationPeriods: 3
      Threshold: 0.8
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no calls, no data
      AlarmActions: [!Ref AlertsTopic]

  # As ApiDurationAlarm, for the functions that work through queues and streams.
  # Their messages are retried, so this warns before they reach a dead-letter queue.
  WorkersDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A worker, listener, the purge job or the outbox relay is close to its timeout (see Duration p99 per function in AWS/Lambda)
      Metrics:
        - Id: worst
          Expression: !If
            - HasAssistant
            - MAX([relay / 60000, subscriptions / 30000, notifications / 30000, tenantpurge / 300000, orderslistener / 60000, billinglistener / 30000, purge / 300000])
            - MAX([relay / 60000, subscriptions / 30000, notifications / 30000, tenantpurge / 300000, orderslistener / 60000, billinglistener / 30000])
          ReturnData: true
        - { Id: relay, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref OutboxRelayFunction }] } } }
        - { Id: subscriptions, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsSubscriptionsFunction }] } } }
        - { Id: notifications, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref NotificationsWorkerFunction }] } } }
        - { Id: tenantpurge, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref AccountsPurgeFunction }] } } }
        - { Id: orderslistener, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref OrdersListenerFunction }] } } }
        - { Id: billinglistener, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref BillingListenerFunction }] } } }
        - !If
          - HasAssistant
          - { Id: purge, ReturnData: false, MetricStat: { Stat: p99, Period: 300, Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref AssistantPurgeFunction }] } } }
          - !Ref AWS::NoValue
      EvaluationPeriods: 3
      Threshold: 0.8
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no work, no data
      AlarmActions: [!Ref AlertsTopic]

  # =====================================================================
  # Module: accounts  (/tenants, /users, login trigger, plan listener)
  # =====================================================================
  AccountsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification: { StreamViewType: NEW_IMAGE }       # feeds the outbox relay
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  AccountsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/accounts/src/
      Handler: accounts.handler.handler
      AutoPublishAlias: live            # rollout: see Mappings.Rollout
      DeploymentPreference:
        Type: !FindInMap [Rollout, !Ref Stage, Type]
        Alarms: [!Ref ApiFunctionErrorsAlarm, !Ref LambdaThrottlesAlarm]
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: accounts
          ACCOUNTS_TABLE: !Ref AccountsTable
          TENANT_DELETION_DAYS: !Ref TenantDeletionDays
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:AdminUserGlobalSignOut]   # on role change / removal
              Resource: !GetAtt UserPool.Arn
      Events:
        # One event per method, never ANY: an ANY route also catches the browser's CORS
        # preflight (OPTIONS) and sends it to the JWT authorizer, which answers 401. With no
        # OPTIONS route, API Gateway answers preflights itself (CorsConfiguration).
        TenantsGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /tenants, Method: GET } }
        TenantsPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /tenants, Method: POST } }
        TenantsAnyGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/tenants/{proxy+}", Method: GET } }
        TenantsAnyPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/tenants/{proxy+}", Method: POST } }       # restore
        TenantsAnyDelete: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/tenants/{proxy+}", Method: DELETE } }   # delete
        UsersGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /users, Method: GET } }
        UsersAnyGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/users/{proxy+}", Method: GET } }
        UsersAnyPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/users/{proxy+}", Method: POST } }
        UsersAnyPatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/users/{proxy+}", Method: PATCH } }
        UsersAnyDelete: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/users/{proxy+}", Method: DELETE } }
        InvitationsGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /invitations, Method: GET } }
        InvitationsAnyPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/invitations/{proxy+}", Method: POST } }

  AccountsPreTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/accounts/src/
      Handler: accounts.pre_token.handler
      Timeout: 5                        # login waits for this
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: accounts
          ACCOUNTS_TABLE: !Ref AccountsTable
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }   # only reads the claims
      Events:
        PreToken:
          Type: Cognito
          Properties: { UserPool: !Ref UserPool, Trigger: PreTokenGeneration }

  # Cognito waits for the trigger on every sign-in and token refresh, with no retry:
  # while it fails, nobody can sign in (e.g. a broken shared layer, ImportModuleError).
  AccountsPreTokenErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Sign-ins are failing (the login trigger errored; see AccountsPreTokenFunction in the app log group)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AccountsPreTokenFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # no sign-ins, no data
      AlarmActions: [!Ref AlertsTopic]

  AccountsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # keep failed messages 14 days

  AccountsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180            # 6x the listener timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AccountsDLQ.Arn
        maxReceiveCount: 5

  AccountsRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [saas.app]
        detail-type: [SubscriptionChanged]
      Targets:
        - Id: AccountsQueue
          Arn: !GetAtt AccountsQueue.Arn
          # An event EventBridge can't deliver (say the queue refuses it) goes to the
          # dead-letter queue within an hour, where the alarm and the redrive work,
          # instead of being dropped after 24 hours.
          RetryPolicy: { MaximumRetryAttempts: 185, MaximumEventAgeInSeconds: 3600 }
          DeadLetterConfig: { Arn: !GetAtt AccountsDLQ.Arn }

  AccountsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AccountsQueue]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt AccountsQueue.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt AccountsQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt AccountsRule.Arn }

  AccountsDLQPolicy:                    # the rule's undelivered events (DeadLetterConfig above)
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AccountsDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt AccountsDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt AccountsDLQ.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt AccountsRule.Arn }

  AccountsSubscriptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/accounts/src/
      Handler: accounts.subscriptions.handler
      Timeout: 30
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: accounts
          ACCOUNTS_TABLE: !Ref AccountsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:UpdateItem]   # only updates the plan copy
              Resource: !GetAtt AccountsTable.Arn
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt AccountsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            # A backlog (or a DLQ redrive) waits in the queue instead of taking the
            # account's Lambda concurrency from the API and the login trigger.
            ScalingConfig: { MaximumConcurrency: 5 }

  AccountsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Plan changes keep failing or weren't delivered (messages in the accounts dead-letter queue)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt AccountsDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # A scheduled job (the pattern for every one): EventBridge Scheduler invokes the
  # function asynchronously; Lambda retries a failed run twice. A run that still
  # fails, and a schedule that couldn't invoke the function, go to the job's
  # dead-letter queue, which has an alarm. Each run starts from what is stored,
  # so the next one continues a failed or unfinished run.
  # This one purges deleted workspaces whose grace period has ended (accounts/purge.py).
  AccountsPurgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/accounts/src/
      Handler: accounts.purge.handler
      Timeout: 300                      # stops a minute before, and the next run continues
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: accounts
          ACCOUNTS_TABLE: !Ref AccountsTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }   # the index, members, the workspace's items
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure: { Type: SQS, Destination: !GetAtt AccountsPurgeDLQ.Arn }
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            RetryPolicy: { MaximumRetryAttempts: 3, MaximumEventAgeInSeconds: 3600 }
            DeadLetterConfig: { Arn: !GetAtt AccountsPurgeDLQ.Arn }   # SAM lets the schedule send to it

  AccountsPurgeDLQ:                     # runs that failed 3 times, and schedules that couldn't start one
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  AccountsPurgeDLQPolicy:               # Lambda and the schedule send with their roles; this only refuses plain HTTP
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AccountsPurgeDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt AccountsPurgeDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }

  AccountsPurgeDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The workspace purge job failed 3 times in a row (see accounts.purge in the app log group; the next hourly run retries)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt AccountsPurgeDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # =====================================================================
  # Module: orders  (/orders)
  # The sample module: copy it to start your own, remove it once you don't need
  # the example ("The sample module" in the README lists what uses it).
  # =====================================================================
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      StreamSpecification: { StreamViewType: NEW_IMAGE }       # feeds the outbox relay
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  OrdersApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/orders/src/
      Handler: orders.handler.handler
      AutoPublishAlias: live            # rollout: see Mappings.Rollout
      DeploymentPreference:
        Type: !FindInMap [Rollout, !Ref Stage, Type]
        Alarms: [!Ref ApiFunctionErrorsAlarm, !Ref LambdaThrottlesAlarm]
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: orders
          ORDERS_TABLE: !Ref OrdersTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
      Events:
        OrdersGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /orders, Method: GET } }
        OrdersPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /orders, Method: POST } }
        OrdersAnyGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/orders/{proxy+}", Method: GET } }
        OrdersAnyPatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/orders/{proxy+}", Method: PATCH } }

  # A deleted workspace is purged (accounts' TenantDeleted): its orders go.
  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # keep failed messages 14 days

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360            # 6x the listener timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        maxReceiveCount: 5

  OrdersRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [saas.app]
        detail-type: [TenantDeleted]
      Targets:
        - Id: OrdersQueue
          Arn: !GetAtt OrdersQueue.Arn
          RetryPolicy: { MaximumRetryAttempts: 185, MaximumEventAgeInSeconds: 3600 }   # as AccountsRule
          DeadLetterConfig: { Arn: !GetAtt OrdersDLQ.Arn }

  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersQueue]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt OrdersQueue.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt OrdersRule.Arn }

  OrdersDLQPolicy:                    # the rule's undelivered events (DeadLetterConfig above)
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt OrdersDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersDLQ.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt OrdersRule.Arn }

  OrdersListenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/orders/src/
      Handler: orders.listener.handler
      Timeout: 60
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: orders
          ORDERS_TABLE: !Ref OrdersTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem]   # deletes a purged workspace's orders
              Resource: !GetAtt OrdersTable.Arn
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt OrdersQueue.Arn
            BatchSize: 1                # one workspace per run: a retry repeats only that one
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }   # no hurry: a few at a time

  OrdersDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A purged workspace's orders weren't deleted (messages in the orders dead-letter queue)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt OrdersDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # =====================================================================
  # Module: notifications  (/notifications, SQS worker)
  # =====================================================================
  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }   # processed-event records
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  NotificationsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/notifications/src/
      Handler: notifications.handler.handler
      AutoPublishAlias: live            # rollout: see Mappings.Rollout
      DeploymentPreference:
        Type: !FindInMap [Rollout, !Ref Stage, Type]
        Alarms: [!Ref ApiFunctionErrorsAlarm, !Ref LambdaThrottlesAlarm]
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: notifications
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:UpdateItem]   # list and mark as read
              Resource: !GetAtt NotificationsTable.Arn
      Events:
        ListGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /notifications, Method: GET } }
        ListAnyPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/notifications/{proxy+}", Method: POST } }

  NotificationsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # keep failed messages 14 days

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180            # 6x the worker timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDLQ.Arn
        maxReceiveCount: 5

  NotificationsRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [saas.app]
        detail-type: [OrderCreated, UserInvited, SubscriptionChanged, PaymentFailed, MemberRemoved, TenantDeleted]
      Targets:
        - Id: NotificationsQueue
          Arn: !GetAtt NotificationsQueue.Arn
          # Undelivered events go to the dead-letter queue within an hour (see AccountsRule).
          RetryPolicy: { MaximumRetryAttempts: 185, MaximumEventAgeInSeconds: 3600 }
          DeadLetterConfig: { Arn: !GetAtt NotificationsDLQ.Arn }

  NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationsQueue]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt NotificationsQueue.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt NotificationsRule.Arn }

  NotificationsDLQPolicy:               # the rule's undelivered events (DeadLetterConfig above)
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationsDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt NotificationsDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsDLQ.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt NotificationsRule.Arn }

  NotificationsWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/notifications/src/
      Handler: notifications.worker.handler
      Timeout: 30
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: notifications
          NOTIFICATIONS_TABLE: !Ref NotificationsTable
          EMAIL_SENDER: !Ref EmailSender
          APP_URL: !If [HasAppUrl, !Ref AppUrl, !Sub "https://${WebDistribution.DomainName}"]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*   # this account's senders only
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 5 }   # as AccountsSubscriptionsFunction

  NotificationsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Notifications keep failing or weren't delivered (messages in the dead-letter queue)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt NotificationsDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # =====================================================================
  # Module: billing  (/billing, payment webhook)
  # =====================================================================
  BillingTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      StreamSpecification: { StreamViewType: NEW_IMAGE }       # feeds the outbox relay
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  BillingApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/billing/src/
      Handler: billing.handler.handler
      AutoPublishAlias: live            # rollout: see Mappings.Rollout
      DeploymentPreference:
        Type: !FindInMap [Rollout, !Ref Stage, Type]
        Alarms: [!Ref ApiFunctionErrorsAlarm, !Ref LambdaThrottlesAlarm]
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: billing
          BILLING_TABLE: !Ref BillingTable
          APP_URL: !If [HasAppUrl, !Ref AppUrl, !Sub "https://${WebDistribution.DomainName}"]
          PAYMENT_PROVIDER: !Ref PaymentProvider
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParam
          STRIPE_CONFIG_PARAM: !Ref StripeConfigParam
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]   # summary and checkout; no webhook secret
              Resource: !GetAtt BillingTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]                        # Stripe's key and config, to start checkouts
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeConfigParam}"
      Events:
        BillingGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /billing, Method: GET } }
        BillingAnyPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/billing/{proxy+}", Method: POST } }

  BillingWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/billing/src/
      Handler: billing.webhook.handler
      AutoPublishAlias: live            # rollout: see Mappings.Rollout
      DeploymentPreference:
        Type: !FindInMap [Rollout, !Ref Stage, Type]
        Alarms: [!Ref ApiFunctionErrorsAlarm, !Ref LambdaThrottlesAlarm]
      Timeout: 15
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: billing
          BILLING_TABLE: !Ref BillingTable
          PAYMENT_WEBHOOK_SECRET_PARAM: !Ref PaymentWebhookSecretParam
          APP_URL: !If [HasAppUrl, !Ref AppUrl, !Sub "https://${WebDistribution.DomainName}"]
          PAYMENT_PROVIDER: !Ref PaymentProvider
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParam
          STRIPE_CONFIG_PARAM: !Ref StripeConfigParam
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref BillingTable }
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PaymentWebhookSecretParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeConfigParam}"
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /webhooks/payments
            Method: POST
            Auth: { Authorizer: NONE }   # provider calls this; signature is checked in code

  # A workspace being deleted (accounts' TenantDeletionScheduled): its Stripe subscription stops renewing,
  # and renews again if it is restored (TenantRestored); once purged (TenantDeleted) it is cancelled.
  BillingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600   # keep failed messages 14 days

  BillingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180            # 6x the listener timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BillingDLQ.Arn
        maxReceiveCount: 5

  BillingRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [saas.app]
        detail-type: [TenantDeletionScheduled, TenantRestored, TenantDeleted]
      Targets:
        - Id: BillingQueue
          Arn: !GetAtt BillingQueue.Arn
          RetryPolicy: { MaximumRetryAttempts: 185, MaximumEventAgeInSeconds: 3600 }   # as AccountsRule
          DeadLetterConfig: { Arn: !GetAtt BillingDLQ.Arn }

  BillingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref BillingQueue]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt BillingQueue.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt BillingQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt BillingRule.Arn }

  BillingDLQPolicy:                    # the rule's undelivered events (DeadLetterConfig above)
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref BillingDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt BillingDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt BillingDLQ.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt BillingRule.Arn }

  BillingListenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: modules/billing/src/
      Handler: billing.listener.handler
      Timeout: 30
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: billing
          BILLING_TABLE: !Ref BillingTable
          PAYMENT_WEBHOOK_SECRET_PARAM: !Ref PaymentWebhookSecretParam   # not read: the settings expect it
          APP_URL: !If [HasAppUrl, !Ref AppUrl, !Sub "https://${WebDistribution.DomainName}"]
          PAYMENT_PROVIDER: !Ref PaymentProvider
          STRIPE_SECRET_KEY_PARAM: !Ref StripeSecretKeyParam
          STRIPE_CONFIG_PARAM: !Ref StripeConfigParam
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]   # the subscription: its renewal, then its tombstone
              Resource: !GetAtt BillingTable.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]                        # Stripe's key, to stop the renewal or cancel
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretKeyParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeConfigParam}"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt BillingQueue.Arn
            BatchSize: 1                # one workspace per run: a retry repeats only that one
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }   # no hurry: a few at a time

  BillingDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A purged workspace's subscription wasn't cancelled (messages in the billing dead-letter queue; check Stripe)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt BillingDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # =====================================================================
  # Web app (web/): a private S3 bucket behind CloudFront.
  # web/scripts/deploy.sh builds the app and uploads it.
  # =====================================================================
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:     # only CloudFront reads it (WebBucketPolicy)
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: false } }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} web app"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200        # North America, Europe, Asia; not the costliest regions
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policies: CachingOptimized (follows the Cache-Control that deploy.sh
          # sets on each file) and SecurityHeadersPolicy (HSTS, nosniff, frame and referrer rules).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # The app routes in the browser: a path that is not a file (/orders/123) gets
        # index.html. S3 answers 403 for a missing key, since CloudFront may not list the bucket.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 10 }

  # =====================================================================
  # Module: assistant  (AI agent on Amazon Bedrock AgentCore Runtime)
  # Not a Lambda function: AgentCore runs the code zip that
  # scripts/package-assistant.py uploads, one microVM per conversation.
  # The model is called through OpenRouter (or Bedrock, by AssistantModelId).
  # Created only when AssistantCodeBucket and AssistantCodeKey are set.
  # =====================================================================
  AssistantTable:
    Type: AWS::DynamoDB::Table
    Condition: HasAssistant
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # Each user's conversations, most recent first (repository.py). Only what
        # the list and the purge read: each message moves gsi1sk, which rewrites
        # the conversation's copy here, so its versions and run stay out.
        - IndexName: ConversationsByUser
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [thread_id, title, title_source, created_at, updated_at, message_count, agents, expires_at]
      # Old usage, and, if AssistantConversationDays is set, conversations that
      # many days after their last message: only a conversation's META has a
      # TTL. The stream brings its removal to the purge worker, which deletes
      # the messages and checkpoints (purge.py).
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      StreamSpecification: { StreamViewType: OLD_IMAGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # Each agent's state in each conversation: LangGraph checkpoints, written
  # by DynamoDBSaver (langgraph-checkpoint-aws), which names the keys and the
  # TTL attribute itself. Each one expires CHECKPOINT_DAYS (30, settings.py)
  # after it was written; an active conversation keeps writing new ones, and
  # an agent whose checkpoints expired starts again from the history.
  AssistantCheckpointTable:
    Type: AWS::DynamoDB::Table
    Condition: HasAssistant
    DeletionPolicy: Retain                # users' conversations outlive the stack, like the other tables
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # A checkpoint over 350 KB, which DynamoDB can't hold. DynamoDBSaver adds
  # the lifecycle rule that expires them, from the same TTL.
  AssistantCheckpointBucket:
    Type: AWS::S3::Bucket
    Condition: HasAssistant
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]

  # The users' files: what they attach to messages, and what agents make for
  # them, one object per version (assistant/files.py). The browser uploads
  # straight here with a presigned POST from the HTTP API, tagged pending:
  # unless a message takes it (the tag goes), the rule below deletes it a
  # day later. Downloads are presigned GETs. Kept until their user deletes
  # them or leaves the workspace (the purge worker).
  AssistantFilesBucket:
    Type: AWS::S3::Bucket
    Condition: HasAssistant
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!If [HasCorsOrigin, !Ref CorsOrigin, !Sub "https://${WebDistribution.DomainName}"]]
            AllowedMethods: [POST, GET]     # uploads; GET: the app previews a text file
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: UploadsNeverSent
            Status: Enabled
            TagFilters: [{ Key: pending, Value: "true" }]
            ExpirationInDays: 1

  # The bash tool's terminal: a separate microVM per conversation, so the
  # model's commands never run next to the agent's credentials. No
  # ExecutionRoleArn: commands in it can't call any AWS API.
  AssistantSandbox:
    Type: AWS::BedrockAgentCore::CodeInterpreterCustom
    Condition: HasAssistant
    Properties:
      Name: !Sub saas_${Stage}_sandbox
      Description: The assistant's terminal (bash tool), one session per conversation
      NetworkConfiguration: { NetworkMode: !Ref AssistantSandboxNetwork }

  AssistantRuntimeRole:
    Type: AWS::IAM::Role
    Condition: HasAssistant
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
              ArnLike: { aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*" }
      Policies:
        - PolicyName: assistant
          PolicyDocument:
            Statement:
              - Sid: Code
                Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub arn:aws:s3:::${AssistantCodeBucket}/${AssistantCodeKey}
              - Sid: ModelKey             # the OpenRouter API key
                Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenRouterApiKeyParam}"
              - Sid: Model                # Bedrock models, when AssistantModelId (or an agent) names one
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*      # regional models a profile routes to
                  - arn:aws:bedrock:::foundation-model/*       # global cross-Region inference
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Sid: Checkpoints          # what DynamoDBSaver calls
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:BatchGetItem,
                         dynamodb:BatchWriteItem]
                Resource: !GetAtt AssistantCheckpointTable.Arn
              - Sid: LargeCheckpoints     # over 350 KB
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:PutObjectTagging]
                Resource: !Sub "${AssistantCheckpointBucket.Arn}/*"
              - Sid: LargeCheckpointsExpiry   # DynamoDBSaver adds the rule that expires them
                Effect: Allow
                Action: [s3:GetLifecycleConfiguration, s3:PutLifecycleConfiguration]
                Resource: !GetAtt AssistantCheckpointBucket.Arn
              # Usage counters, each conversation's history (service.ConversationLog), and
              # what the agents remember about each user (DeleteItem: the forget tool);
              # Query reads the history back for an agent whose checkpoints expired (app.restored).
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:BatchWriteItem,
                         dynamodb:DeleteItem]
                Resource: !GetAtt AssistantTable.Arn
              - Sid: Files                  # the users' files: attachments read for the model, files agents save
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${AssistantFilesBucket.Arn}/*"
              - Sid: Sandbox                # assistant/sandbox.py
                Effect: Allow
                Action: [bedrock-agentcore:StartCodeInterpreterSession, bedrock-agentcore:InvokeCodeInterpreter]
                Resource: !GetAtt AssistantSandbox.CodeInterpreterArn
              - Sid: WorkloadIdentity       # as in AWS's execution role; not ...ForUserId (no IdP check)
                Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken, bedrock-agentcore:GetWorkloadAccessTokenForJWT]
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/saas_${Stage}_assistant-*
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: LogGroups
                Effect: Allow
                Action: [logs:DescribeLogGroups]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: Traces
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: [cloudwatch:PutMetricData]
                Resource: "*"
                Condition: { StringEquals: { cloudwatch:namespace: bedrock-agentcore } }

  AssistantRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: HasAssistant
    Properties:
      AgentRuntimeName: !Sub saas_${Stage}_assistant
      Description: Assistant for signed-in users (LangChain agent)
      RoleArn: !GetAtt AssistantRuntimeRole.Arn
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code: { S3: { Bucket: !Ref AssistantCodeBucket, Prefix: !Ref AssistantCodeKey } }
          Runtime: PYTHON_3_13
          EntryPoint: [opentelemetry-instrument, main.py]   # traces to CloudWatch (scripts/enable-transaction-search.sh, once per account)
      NetworkConfiguration: { NetworkMode: PUBLIC }
      ProtocolConfiguration: AGUI           # AG-UI events (assistant/schemas.py); AgentCore's own errors are RUN_ERROR events too
      # Only this user pool's ID tokens get in, like the HTTP API: access
      # tokens carry no aud, and the token_use rule rejects anything else.
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration
          AllowedAudience: [!Ref UserPoolClient]
          CustomClaims:
            - InboundTokenClaimName: token_use
              InboundTokenClaimValueType: STRING
              AuthorizingClaimMatchValue:
                ClaimMatchOperator: EQUALS
                ClaimMatchValue: { MatchValueString: id }
      RequestHeaderConfiguration:
        RequestHeaderAllowlist: [Authorization]   # the verified token reaches the code (claims, and the tools' API calls)
      LifecycleConfiguration:
        IdleRuntimeSessionTimeout: 900    # an idle conversation's microVM stops after 15 minutes; its checkpoints remain
        MaxLifetime: 28800
      EnvironmentVariables:
        POWERTOOLS_SERVICE_NAME: assistant
        POWERTOOLS_LOG_LEVEL: INFO
        PYTHONUNBUFFERED: "1"             # logs reach CloudWatch even if the microVM stops right after
        ASSISTANT_TABLE: !Ref AssistantTable
        CHECKPOINT_TABLE: !Ref AssistantCheckpointTable
        CHECKPOINT_BUCKET: !Ref AssistantCheckpointBucket
        FILES_BUCKET: !Ref AssistantFilesBucket
        API_URL: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
        MODEL_ID: !Ref AssistantModelId
        OPENROUTER_API_KEY_PARAM: !Ref OpenRouterApiKeyParam
        REGION: !Ref AWS::Region
        SANDBOX_ID: !GetAtt AssistantSandbox.CodeInterpreterId
        CONVERSATION_DAYS: !Ref AssistantConversationDays   # 0: kept until deleted; else it goes, checkpoints and all
        # ADOT's LangChain instrumentation logs every model call's messages (the
        # conversation so far, the answer) to this runtime's log group, and
        # traces each model call and middleware step. Dev keeps both, the
        # messages for a week (AssistantLogRetention); prod keeps neither, so a
        # conversation lives only where the app can delete it.
        AWS_GENAI_INSTRUMENTATION: !If [IsProd, disabled, enabled]

  # AgentCore creates the runtime's log group itself, with the runtime and no
  # retention, so CloudFormation can't own it: this sets its retention.
  AssistantLogRetention:
    Type: Custom::LogRetention
    Condition: HasAssistant
    Properties:
      ServiceToken: !GetAtt AssistantLogRetentionFunction.Arn
      LogGroupName: !Sub /aws/bedrock-agentcore/runtimes/${AssistantRuntime.AgentRuntimeId}-DEFAULT
      RetentionInDays: !If [IsProd, !Ref LogRetentionDays, 7]   # dev's holds the conversations' text

  AssistantLogRetentionFunction:
    Type: AWS::Serverless::Function
    Condition: HasAssistant
    Properties:
      Handler: index.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: [logs:CreateLogGroup, logs:PutRetentionPolicy]
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
      InlineCode: |
        import boto3
        import cfnresponse

        logs = boto3.client("logs")


        def handler(event, context):
            """Sets the log group's retention, creating the group if it isn't there yet. Leaves it on delete."""
            name = event["ResourceProperties"]["LogGroupName"]
            try:
                if event["RequestType"] != "Delete":
                    try:
                        logs.create_log_group(logGroupName=name)
                    except logs.exceptions.ResourceAlreadyExistsException:
                        pass
                    days = int(event["ResourceProperties"]["RetentionInDays"])
                    logs.put_retention_policy(logGroupName=name, retentionInDays=days)
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, name)
            except Exception as error:
                cfnresponse.send(event, context, cfnresponse.FAILED, {}, name, reason=str(error))

  # The users' conversations (/assistant/conversations): send a message (saved,
  # with the run that will answer it, before AgentCore runs it), stop an
  # answer, list, reopen, rename, delete; what the assistant remembers about
  # each user (/assistant/memories); their files (/assistant/files: uploads,
  # presigned, and links to download). A Lambda behind the HTTP API like
  # the other modules; the agent writes the answers. Same code as the agent,
  # but only the shared layer: these files never import LangChain (a test checks).
  AssistantApiFunction:
    Type: AWS::Serverless::Function
    Condition: HasAssistant
    Properties:
      CodeUri: modules/assistant/src/
      Handler: assistant.handler.handler
      AutoPublishAlias: live            # rollout: see Mappings.Rollout
      DeploymentPreference:
        Type: !FindInMap [Rollout, !Ref Stage, Type]
        Alarms: [!Ref ApiFunctionErrorsAlarm, !Ref LambdaThrottlesAlarm]
        PassthroughCondition: true      # its deployment group exists only with the assistant
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: assistant
          ASSISTANT_TABLE: !Ref AssistantTable
          FILES_BUCKET: !Ref AssistantFilesBucket
          PURGE_QUEUE_URL: !Ref AssistantPurgeQueue
          REGION: !Ref AWS::Region
          CONVERSATION_DAYS: !Ref AssistantConversationDays   # as the runtime's: each message moves the expiry on
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:BatchWriteItem,
                       dynamodb:DeleteItem]
              Resource: [!GetAtt AssistantTable.Arn, !Sub "${AssistantTable.Arn}/index/ConversationsByUser"]
            # Presigned uploads (PutObject with its tag) and downloads (GetObject) act as this role;
            # HeadObject (GetObject) checks an upload arrived, DeleteObjectTagging keeps it.
            - Effect: Allow
              Action: [s3:PutObject, s3:PutObjectTagging, s3:GetObject, s3:DeleteObject, s3:DeleteObjectTagging]
              Resource: !Sub "${AssistantFilesBucket.Arn}/*"
        - SQSSendMessagePolicy: { QueueName: !GetAtt AssistantPurgeQueue.QueueName }
      Events:
        ListGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/conversations, Method: GET } }
        MemoriesGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/memories, Method: GET } }
        MemoriesPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/memories, Method: POST } }
        MemoriesPatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/memories, Method: PATCH } }
        MemoriesDelete: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/memories, Method: DELETE } }
        MemoryPatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/memories/{proxy+}", Method: PATCH } }
        MemoryDelete: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/memories/{proxy+}", Method: DELETE } }
        FilesGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/files, Method: GET } }
        FilesPost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /assistant/files, Method: POST } }
        FileGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/files/{proxy+}", Method: GET } }
        FileDelete: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/files/{proxy+}", Method: DELETE } }
        OneGet: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/conversations/{proxy+}", Method: GET } }
        OnePost: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/conversations/{proxy+}", Method: POST } }
        OnePatch: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/conversations/{proxy+}", Method: PATCH } }
        OneDelete: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/assistant/conversations/{proxy+}", Method: DELETE } }

  # Deleted conversations, for the agents' checkpoints of them: hundreds of
  # records, too many for the request (assistant/purge.py), and members who
  # left a workspace, for all their conversations there. Also where the purge
  # of an expired conversation goes when it keeps failing.
  AssistantPurgeDLQ:
    Type: AWS::SQS::Queue
    Condition: HasAssistant
    Properties:
      MessageRetentionPeriod: 1209600   # keep failed messages 14 days

  AssistantPurgeQueue:
    Type: AWS::SQS::Queue
    Condition: HasAssistant
    Properties:
      VisibilityTimeout: 1800           # 6x the worker timeout
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AssistantPurgeDLQ.Arn
        maxReceiveCount: 5              # each try continues where the last stopped

  AssistantPurgeFunction:
    Type: AWS::Serverless::Function
    Condition: HasAssistant
    Properties:
      CodeUri: modules/assistant/src/
      Handler: assistant.purge.handler
      Timeout: 300
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: assistant
          ASSISTANT_TABLE: !Ref AssistantTable
          CHECKPOINT_TABLE: !Ref AssistantCheckpointTable
          CHECKPOINT_BUCKET: !Ref AssistantCheckpointBucket
          FILES_BUCKET: !Ref AssistantFilesBucket
          REGION: !Ref AWS::Region
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:Query, dynamodb:BatchWriteItem]
              Resource:
                - !GetAtt AssistantCheckpointTable.Arn
                - !GetAtt AssistantTable.Arn
                - !Sub "${AssistantTable.Arn}/index/ConversationsByUser"   # a removed member's conversations
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: [!GetAtt AssistantCheckpointBucket.Arn, !GetAtt AssistantFilesBucket.Arn]
            - Effect: Allow
              Action: [s3:DeleteObject]
              Resource: [!Sub "${AssistantCheckpointBucket.Arn}/*", !Sub "${AssistantFilesBucket.Arn}/*"]
        - SQSSendMessagePolicy: { QueueName: !GetAtt AssistantPurgeDLQ.QueueName }   # a stream batch that kept failing
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt AssistantPurgeQueue.Arn
            BatchSize: 1                # one conversation per run: a retry repeats only that one
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig: { MaximumConcurrency: 2 }   # no hurry: a few at a time
        Expired:                        # TTL removed a conversation's META (repository.py)
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AssistantTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["REMOVE"], "userIdentity": {"type": ["Service"], "principalId": ["dynamodb.amazonaws.com"]}, "dynamodb": {"Keys": {"sk": {"S": ["META"]}}}}'
            FunctionResponseTypes: [ReportBatchItemFailures]
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            DestinationConfig: { OnFailure: { Destination: !GetAtt AssistantPurgeDLQ.Arn } }

  # A member who left a workspace, or was removed (accounts' MemberRemoved), and a
  # deleted workspace being purged (TenantDeleted): the purge worker deletes their
  # conversations there.
  AssistantMembersRule:
    Type: AWS::Events::Rule
    Condition: HasAssistant
    Properties:
      EventBusName: !Ref EventBus
      EventPattern:
        source: [saas.app]
        detail-type: [MemberRemoved, TenantDeleted]
      Targets:
        - Id: AssistantPurgeQueue
          Arn: !GetAtt AssistantPurgeQueue.Arn
          RetryPolicy: { MaximumRetryAttempts: 185, MaximumEventAgeInSeconds: 3600 }
          DeadLetterConfig: { Arn: !GetAtt AssistantPurgeDLQ.Arn }

  AssistantPurgeQueuePolicy:            # the HTTP API sends with its role; EventBridge needs this
    Type: AWS::SQS::QueuePolicy
    Condition: HasAssistant
    Properties:
      Queues: [!Ref AssistantPurgeQueue]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt AssistantPurgeQueue.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt AssistantPurgeQueue.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt AssistantMembersRule.Arn }

  AssistantPurgeDLQPolicy:              # the rule's undelivered events (DeadLetterConfig above)
    Type: AWS::SQS::QueuePolicy
    Condition: HasAssistant
    Properties:
      Queues: [!Ref AssistantPurgeDLQ]
      PolicyDocument:
        Statement:
          - Sid: HttpsOnly                # no client may use it over plain HTTP
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt AssistantPurgeDLQ.Arn
            Condition: { Bool: { aws:SecureTransport: false } }
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt AssistantPurgeDLQ.Arn
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt AssistantMembersRule.Arn }

  AssistantPurgeDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAssistant
    Properties:
      AlarmDescription: >-
        Deleted, expired or removed members' assistant conversations still have data
        (messages in the purge dead-letter queue)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt AssistantPurgeDLQ.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching      # an idle queue sends no data
      AlarmActions: [!Ref AlertsTopic]

  # One page for how the stack is doing day to day; the alarms say when it broke.
  # Assistant widgets only when the assistant is deployed.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Join
        - ""
        - - !Sub |
              {"widgets":[
              {"type":"alarm","x":0,"y":0,"width":24,"height":3,"properties":{"title":"Alarms","alarms":[
                "${ApiErrorsAlarm.Arn}","${AccountsPreTokenErrorsAlarm.Arn}","${LambdaThrottlesAlarm.Arn}",
                "${ApiDurationAlarm.Arn}","${WorkersDurationAlarm.Arn}","${OutboxLagAlarm.Arn}","${OutboxDLQAlarm.Arn}",
                "${AccountsDLQAlarm.Arn}","${NotificationsDLQAlarm.Arn}","${OrdersDLQAlarm.Arn}","${BillingDLQAlarm.Arn}",
                "${AccountsPurgeDLQAlarm.Arn}"]}},
              {"type":"metric","x":0,"y":3,"width":12,"height":6,"properties":{"title":"API requests and errors","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[
                ["AWS/ApiGateway","Count","ApiId","${HttpApi}",{"label":"requests"}],
                ["AWS/ApiGateway","4xx","ApiId","${HttpApi}",{"label":"4xx"}],
                ["AWS/ApiGateway","5xx","ApiId","${HttpApi}",{"label":"5xx"}]]}},
              {"type":"metric","x":12,"y":3,"width":12,"height":6,"properties":{"title":"API latency (ms)","region":"${AWS::Region}","period":300,"view":"timeSeries","metrics":[
                ["AWS/ApiGateway","Latency","ApiId","${HttpApi}",{"stat":"p50","label":"p50"}],
                ["AWS/ApiGateway","Latency","ApiId","${HttpApi}",{"stat":"p99","label":"p99"}]]}},
              {"type":"metric","x":0,"y":9,"width":12,"height":6,"properties":{"title":"Function errors","region":"${AWS::Region}","stat":"Sum","period":300,"view":"timeSeries","metrics":[
                ["AWS/Lambda","Errors","FunctionName","${AccountsApiFunction}",{"label":"accounts"}],
                ["AWS/Lambda","Errors","FunctionName","${AccountsPreTokenFunction}",{"label":"sign-in"}],
                ["AWS/Lambda","Errors","FunctionName","${OrdersApiFunction}",{"label":"orders"}],
                ["AWS/Lambda","Errors","FunctionName","${NotificationsApiFunction}",{"label":"notifications"}],
                ["AWS/Lambda","Errors","FunctionName","${BillingApiFunction}",{"label":"billing"}],
                ["AWS/Lambda","Errors","FunctionName","${BillingWebhookFunction}",{"label":"payment webhook"}],
                ["AWS/Lambda","Errors","FunctionName","${OutboxRelayFunction}",{"label":"outbox relay"}],
                ["AWS/Lambda","Errors","FunctionName","${AccountsSubscriptionsFunction}",{"label":"plan listener"}],
                ["AWS/Lambda","Errors","FunctionName","${NotificationsWorkerFunction}",{"label":"notifications worker"}],
                ["AWS/Lambda","Errors","FunctionName","${OrdersListenerFunction}",{"label":"orders listener"}],
                ["AWS/Lambda","Errors","FunctionName","${BillingListenerFunction}",{"label":"billing listener"}],
                ["AWS/Lambda","Errors","FunctionName","${AccountsPurgeFunction}",{"label":"workspace purge job"}]]}},
              {"type":"metric","x":12,"y":9,"width":12,"height":6,"properties":{"title":"Lambda concurrency (whole account) and throttles","region":"${AWS::Region}","period":60,"view":"timeSeries","metrics":[
                ["AWS/Lambda","ConcurrentExecutions",{"stat":"Maximum","label":"running at once, account (dev and prod)"}],
                ["AWS/Lambda","Throttles",{"stat":"Sum","label":"throttles, account"}]]}},
              {"type":"metric","x":0,"y":15,"width":12,"height":6,"properties":{"title":"Messages waiting in queues","region":"${AWS::Region}","stat":"Maximum","period":300,"view":"timeSeries","metrics":[
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AccountsQueue.QueueName}",{"label":"accounts"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${NotificationsQueue.QueueName}",{"label":"notifications"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AccountsDLQ.QueueName}",{"label":"accounts DLQ"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${NotificationsDLQ.QueueName}",{"label":"notifications DLQ"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${OutboxDLQ.QueueName}",{"label":"outbox DLQ"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${OrdersQueue.QueueName}",{"label":"orders"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${BillingQueue.QueueName}",{"label":"billing"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${OrdersDLQ.QueueName}",{"label":"orders DLQ"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${BillingDLQ.QueueName}",{"label":"billing DLQ"}],
                ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AccountsPurgeDLQ.QueueName}",{"label":"purge job DLQ"}]]}},
              {"type":"metric","x":12,"y":15,"width":12,"height":6,"properties":{"title":"Events","region":"${AWS::Region}","period":300,"view":"timeSeries","metrics":[
                ["saas-${Stage}","EventsPublished","service","outbox-relay",{"stat":"Sum","label":"published"}],
                ["AWS/Lambda","IteratorAge","FunctionName","${OutboxRelayFunction}",{"stat":"Maximum","label":"oldest waiting (ms)","yAxis":"right"}]]}}
          - !If
            - HasAssistant
            - !Sub |
                ,{"type":"metric","x":0,"y":21,"width":24,"height":6,"properties":{"title":"Assistant","region":"${AWS::Region}","period":300,"view":"timeSeries","metrics":[
                  ["AWS/Lambda","Invocations","FunctionName","${AssistantApiFunction}",{"stat":"Sum","label":"API calls"}],
                  ["AWS/Lambda","Errors","FunctionName","${AssistantApiFunction}",{"stat":"Sum","label":"API errors"}],
                  ["AWS/Lambda","Errors","FunctionName","${AssistantPurgeFunction}",{"stat":"Sum","label":"purge errors"}],
                  ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AssistantPurgeQueue.QueueName}",{"stat":"Maximum","label":"purge queue"}],
                  ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AssistantPurgeDLQ.QueueName}",{"stat":"Maximum","label":"purge DLQ"}]]}}
            - ""
          - "]}"

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebhookUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhooks/payments"
  EventBusName:
    Value: !Ref EventBus
  AlertsTopicArn:
    Value: !Ref AlertsTopic
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}"
  WebUrl:
    Description: The app, once web/scripts/deploy.sh has uploaded it
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  AssistantUrl:
    Condition: HasAssistant
    Description: AG-UI endpoint. POST a RunAgentInput with the ID token (Bearer) and the threadId as the session id header; AG-UI events stream back as SSE
    Value: !Sub "https://bedrock-agentcore.${AWS::Region}.amazonaws.com/runtimes/${AssistantRuntime.AgentRuntimeId}/invocations?qualifier=DEFAULT&accountId=${AWS::AccountId}"
