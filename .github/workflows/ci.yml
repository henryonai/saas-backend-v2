name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --all-packages --locked
      - name: Tests
        run: uv run pytest
      - name: requirements.txt files match uv.lock
        run: ./scripts/export-requirements.sh --check
      - name: Lint Python
        run: uvx ruff check .
      - name: Lint template
        run: uvx cfn-lint template.yaml
