name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:            # deploy.yml runs these checks before deploying

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0   # no major tags since v8: pin a release
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --all-packages --locked
      - name: Tests
        run: uv run pytest
      - name: requirements.txt files match uv.lock
        run: ./scripts/export-requirements.sh --check
      - name: Lint Python
        run: uvx ruff check .
      - name: Lint templates
        run: uvx cfn-lint template.yaml .github/deploy-role.yaml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (fails if pnpm-lock.yaml is out of date)
        run: pnpm install --frozen-lockfile
      - name: API types and plans match the backend
        run: |
          uv sync --all-packages --locked
          pnpm gen:api
          test -z "$(git status --porcelain src/shared/api/generated)" || { git status --short src/shared/api/generated; exit 1; }
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
