name: Something doesn't work
description: A step, script, deploy or feature that fails or does something unexpected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or the relevant lines. Remove keys, emails and account IDs first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag (or template commit) your copy started from.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Setting up a new copy (rename, first deploy)
        - Deploy or CI/CD
        - Backend (an API route, an event, a worker)
        - Web app
        - Assistant
        - Docs
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: OS, and the versions of SAM CLI, uv, Node and pnpm, if it's about setup or deploys.
